services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tasks -d tasks" ]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1" ]
      interval: 5s
      timeout: 5s
      retries: 30

  task-service:
    build: .
    scale: 2
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/tasks
      DB_USER: tasks
      DB_PASSWORD: tasks
      KAFKA_SERVERS: kafka:9092
      TASKS_TOPIC: tasks
      TASKS_TOPIC_PARTITIONS: 3
      TASKS_GROUP_ID: async-task-service
      SPRING_KAFKA_LISTENER_CONCURRENCY: ${SPRING_KAFKA_LISTENER_CONCURRENCY:-2}
      WORKER_MAX_CONCURRENT: ${WORKER_MAX_CONCURRENT:-10}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      WORKER_POLL_DELAY: ${WORKER_POLL_DELAY:-PT1S}
      WORKER_PROGRESS_STEP: ${WORKER_PROGRESS_STEP:-PT1S}
      WORKER_LEASE_DURATION: ${WORKER_LEASE_DURATION:-PT30S}
      WORKER_RETRY_DELAY: ${WORKER_RETRY_DELAY:-PT30S}
      WORKER_RECOVERY_INTERVAL: ${WORKER_RECOVERY_INTERVAL:-PT5S}
      WORKER_RECOVER_BATCH_SIZE: ${WORKER_RECOVER_BATCH_SIZE:-100}
      WORKER_SHUTDOWN_WAIT: ${WORKER_SHUTDOWN_WAIT:-PT20S}
      SPRING_SHUTDOWN_TIMEOUT: ${SPRING_SHUTDOWN_TIMEOUT:-PT45S}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    stop_grace_period: 60s
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness" ]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10

  api:
    image: nginx:1.28-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      task-service:
        condition: service_healthy

volumes:
  postgres-data:
